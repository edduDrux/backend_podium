[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podium-backend"
version = "0.1.0"
description = "Backend do projeto Podium"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "SQLAlchemy>=2.0",
  "asyncpg",
  "python-multipart",
  "alembic",
  "celery",
  "redis",
  "pypdf",
  "httpx",
  "openai>=1.0",
  "pgvector",
  # Documentos
  "python-pptx",
  "python-docx",
  # Áudio
  "pydub",
  "audioop-lts",  # pydub needs audioop, removed from Python 3.13+
  # Autenticação
  "bcrypt",
  "python-jose[cryptography]",
  # Testes
  "pytest",
  "pytest-asyncio",
  "anyio",
  "aiosqlite",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
